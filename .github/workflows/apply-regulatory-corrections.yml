name: Apply regulatory corrections

on:
  push:
    branches:
      - corrections-reglementaires-2026-09
    paths:
      - scripts/apply-regulatory-corrections.mjs
      - .github/workflows/apply-regulatory-corrections.yml

permissions:
  contents: write

jobs:
  correct-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: corrections-reglementaires-2026-09
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply regulatory corrections
        run: node scripts/apply-regulatory-corrections.mjs

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /code-cotier

      - name: Commit corrected sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/course.ts components/ExamPlates.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "fix: align coastal permit content with 2026 rules"
          git push origin HEAD:corrections-reglementaires-2026-09
