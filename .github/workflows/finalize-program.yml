name: Finalize coastal program

on:
  push:
    branches: [main]
    paths:
      - scripts/finalize-program.mjs

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply final content corrections
        run: node scripts/finalize-program.mjs
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          NEXT_PUBLIC_BASE_PATH: /code-cotier
        run: npm run build
      - name: Commit final sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/finalize-program.mjs .github/workflows/finalize-program.yml
          git add data/course.ts
          git commit -m "Complète le programme officiel du permis côtier"
          git push origin main
